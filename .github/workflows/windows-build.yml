name: Windows build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt PyInstaller==6.16.0
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build executable folder
        run: python -m PyInstaller --clean --noconfirm PurpleDragon.spec
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: PurpleDragonFlipperStudio-v0.3.0-Windows-x64
          path: dist/PurpleDragonFlipperStudio/
          if-no-files-found: error
