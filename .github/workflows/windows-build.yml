name: Windows build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'purple_dragon/**'
      - 'tests/**'
      - 'scripts/**'
      - 'requirements.txt'
      - 'PurpleDragon.spec'
      - '.github/workflows/windows-build.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt PyInstaller==6.16.0
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build executable folder
        run: python -m PyInstaller --clean --noconfirm PurpleDragon.spec
      - name: Package matching release assets
        run: python scripts/package_release.py --windows dist/PurpleDragonFlipperStudio --output release-assets
      - name: Upload release assets
        uses: actions/upload-artifact@v6
        with:
          name: PurpleDragonFlipperStudio-release-${{ github.sha }}
          path: release-assets/
          if-no-files-found: error
